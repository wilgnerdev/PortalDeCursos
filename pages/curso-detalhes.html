<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Curso - Pão dos Pobres</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">   

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.ico">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=1">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

    <!-- Fontes -->  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" /> 

    <!-- JS -->
    <script type="module" src="/js/pages/cadastro.js"></script>
    <script type="module" src="/js/pages/formulario-interacao.js"></script>
    <script type="module" src="/js/pages/curso-dinamico.js"></script>

    <script type="module" src="/js/components/site-header.js"></script>
    <script type="module" src="/js/components/site-banner.js"></script>
    <script type="module" src="/js/components/site-voltar.js"></script>
    <script type="module" src="/js/components/site-footer.js"></script>
    <script type="module" src="/js/components/site-grid.js"></script>
    <script type="module" src="/js/components/site-sobre.js"></script>
    <script type="module" src="/js/components/site-form.js"></script>
    <script type="module" src="/js/components/site-faq.js"></script>
    <script type="module" src="/js/components/site-modal.js"></script>


</head>


<body>

    <site-header></site-header>



    <section class="curso-banner" id="curso-banner">
        <div class="texto-banner">
            <h1 id="curso-titulo">Carregando curso...</h1>
            <p id="curso-resumo"></p>
        </div>
    </section>

    <main class="curso-detalhes-main">

        <section class="curso-principal">
            <div class="secao-curso">
                <h2 class="secao-titulo">Sobre o curso</h2>
                <p class="secao-texto" id="curso-sobre"></p>
            </div>

            <div class="secao-curso">
                <h2 class="secao-titulo">O que você vai aprender?</h2>
                <div class="skills-list" id="curso-skills">
                    <!-- gerado dinamicamente por js/pages/curso-dinamico.js -->
                </div>
            </div>
        </section>

        <aside class="sidebar-card">
            <div class="sidebar-topo">

                <div class="badge-hole"></div>
                <p class="sidebar-info">Ficha do curso</p>
                <p class="sidebar-titulo" id="curso-sidebar-titulo">Carregando...</p>
            </div>
            <div class="sidebar-body">
                <div class="info-row">
                    <div class="info-icone">
                        <i class="ti ti-clock"></i>
                    </div>
                    <div>
                        <p class="info-label">Carga horária</p>
                        <p class="info-value" id="curso-carga-horaria"></p>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icone">
                        <i class="ti ti-building"></i>
                    </div>
                    <div>
                        <p class="info-label">Modalidade</p>
                        <p class="info-value" id="curso-modalidade"></p>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icone">
                        <i class="ti ti-users"></i>
                    </div>
                    <div>
                        <p class="info-label">Idade</p>
                        <p class="info-value" id="curso-idade"></p>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icone">
                        <i class="ti ti-school"></i>
                    </div>
                    <div>
                        <p class="info-label">Escolaridade mínima</p>
                        <p class="info-value" id="curso-escolaridade"></p>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icone">
                        <i class="ti ti-sun"></i>
                    </div>
                    <div>
                        <p class="info-label">Turnos</p>
                        <p class="info-value" id="curso-turnos"></p>
                    </div>
                </div>
                <p class="info-nota" id="curso-nota-pcd"></p>
                <a href="/pages/formulario.html" class="btn-sidebar">Inscreva-se agora</a>
                <p class="cta-sub">Vagas limitadas · Formação gratuita</p>
            </div>
        </aside>

    </main>
    <site-voltar></site-voltar>

    <site-footer></site-footer>

    <site-modal></site-modal>
</body>

</html>
